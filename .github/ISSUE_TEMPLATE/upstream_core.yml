name: Upstream-core proposal
description: Identify a generic visual-review improvement that may belong in Lavish AXI
labels: ["upstream-core"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Generic problem
      description: Describe the visual-review problem without relying on R, Shiny, Quarto, or R-process behavior.
    validations:
      required: true

  - type: textarea
    id: generic_rationale
    attributes:
      label: Why this is upstream-core
      description: Explain why the change is generic enough to benefit Lavish AXI users outside R workflows.
    validations:
      required: true

  - type: input
    id: upstream_discussion
    attributes:
      label: Related Lavish AXI issue or pull request
      description: Link an upstream discussion if one exists; otherwise write "none yet".
      placeholder: https://github.com/kunchenguid/lavish-axi/issues/123
    validations:
      required: true

  - type: textarea
    id: downstream_impact
    attributes:
      label: Shiny AXI impact
      description: Note whether Shiny AXI needs the change immediately or can wait for an upstream release.
